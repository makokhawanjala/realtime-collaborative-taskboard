<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time TaskBoard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">
                    <i class="fas fa-tasks"></i>
                    TaskBoard
                </h1>
                <div class="header-info">
                    <div class="connection-status" id="connectionStatus">
                        <i class="fas fa-circle"></i>
                        <span>Connecting...</span>
                    </div>
                    <div class="active-users" id="activeUsers">
                        <i class="fas fa-users"></i>
                        <span>0 active</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Board Header -->
            <div class="board-header">
                <div class="board-info">
                    <h2 id="boardName">Project Alpha</h2>
                    <p id="boardDescription">Main project board for task management</p>
                </div>
                <button class="btn btn-primary" id="addTaskBtn">
                    <i class="fas fa-plus"></i>
                    Add Task
                </button>
            </div>

            <!-- Task Columns -->
            <div class="board-columns">
                <!-- Todo Column -->
                <div class="column" data-status="todo">
                    <div class="column-header">
                        <h3 class="column-title">
                            <i class="fas fa-circle status-todo"></i>
                            To Do
                        </h3>
                        <span class="task-count" id="todoCount">0</span>
                    </div>
                    <div class="task-list" id="todoList">
                        <!-- Tasks will be added here dynamically -->
                    </div>
                </div>

                <!-- In Progress Column -->
                <div class="column" data-status="in_progress">
                    <div class="column-header">
                        <h3 class="column-title">
                            <i class="fas fa-circle status-in-progress"></i>
                            In Progress
                        </h3>
                        <span class="task-count" id="inProgressCount">0</span>
                    </div>
                    <div class="task-list" id="inProgressList">
                        <!-- Tasks will be added here dynamically -->
                    </div>
                </div>

                <!-- Done Column -->
                <div class="column" data-status="done">
                    <div class="column-header">
                        <h3 class="column-title">
                            <i class="fas fa-circle status-done"></i>
                            Done
                        </h3>
                        <span class="task-count" id="doneCount">0</span>
                    </div>
                    <div class="task-list" id="doneList">
                        <!-- Tasks will be added here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Task Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Task</h3>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Title *</label>
                    <input type="text" id="taskTitle" name="title" required 
                           placeholder="Enter task title" maxlength="255">
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" name="description" 
                              placeholder="Enter task description" rows="4"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus" name="status">
                            <option value="todo">To Do</option>
                            <option value="in_progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskDueDate">Due Date</label>
                    <input type="datetime-local" id="taskDueDate" name="due_date">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-save"></i>
                        Save Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Action completed successfully</span>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
